name: Laravel CI

on:
  push:
    branches: [main]
    paths:
      - 'projek1/**'
      - '.github/workflows/laravel.yml'
  pull_request:
    paths:
      - 'projek1/**'
      - '.github/workflows/laravel.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP 8.3)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projek1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projek1/package-lock.json

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('projek1/composer.lock') }}
          restore-keys: |
            composer-

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test --compact
